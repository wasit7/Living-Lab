server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: json_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: app_logs
      host: dev-machine
      __path__: /var/log/app/*.log
  pipeline_stages:
  - json:
      expressions:
        lvl: level
        meth: method
        stat: status
  - labels:
      level: lvl
      method: meth
      status: stat
